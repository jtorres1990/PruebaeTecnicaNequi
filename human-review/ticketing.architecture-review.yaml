  - id: ADR-002
    type: ADR
    priority: HIGH
    title: "Atomic multi-ticket reservation"
    proposal: >
      Conditional writes sobre el estado de cada Ticket, agrupados en una única
      escritura transaccional que además crea la Order con su Reservation, el
      registro de idempotencia y el registro de auditoría. El Event queda fuera
      de la transacción.
    alternatives:
      - Optimistic locking con atributo de versión y lectura previa
      - Conditional writes independientes por Ticket con compensación
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La reserva de múltiples Ticket debe ejecutarse mediante una única operación
      `TransactWriteItems` all-or-nothing. La transacción puede actualizar Ticket
      ubicados en partition keys y particiones físicas diferentes, conforme al
      modelo aprobado en ADR-001, y debe crear en el mismo commit la Order con su
      Reservation, el registro de idempotencia y el registro de auditoría.

      Cada actualización de Ticket debe comprobar condicionalmente que el item
      existe, pertenece al Event solicitado y continúa en estado `AVAILABLE`.
      Si falla la condición de cualquier Ticket, se cancela la transacción
      completa: ningún Ticket cambia, no se crean Reservation ni Order y no se
      retorna Order ID.

      El Event se valida antes de ejecutar la transacción y queda fuera de ella
      para evitar que todas las compras del mismo Event compitan por un único
      item. Esto requiere que el Event sea inmutable después de habilitarse y que
      la validación compruebe que puede venderse.

      Las cancelaciones producidas por conflictos técnicos transaccionales pueden
      reintentarse de forma acotada con jitter. Una condición fallida por un
      Ticket inexistente o no disponible es un rechazo funcional completo y no
      debe reintentarse como conflicto técnico. El máximo de Ticket por Order se
      resolverá en FG-001 respetando los límites vigentes de la transacción.
    impact:
      - TC-011
      - ST-001
      - ST-006
      - FR-004
      - FR-010
      - VAL-010
      - AC-004
      - AC-007
      - AC-016
      - AP-008
      - CMP-005
      - API-004

  - id: ADR-003
    type: ADR
    priority: HIGH
    title: "Tickets per Order limit"
    proposal: >
      Máximo explícito de 10 Ticket por Order, validado en la entrada; una
      solicitud que lo supere se rechaza sin crear nada. Depende de FG-001.
    alternatives:
      - Máximo igual al límite técnico de la transacción
      - Sin máximo, dividiendo la reserva en varias transacciones (descartada por exponer parcialidad)
    decision: CONFIRMED
    answer: >
      Se confirma un mínimo de 1 y un máximo de 10 Ticket por Order. El límite
      debe validarse en el contrato de entrada y nuevamente en el caso de uso.
      Los identificadores de Ticket repetidos dentro de la misma solicitud no
      están permitidos.

      Una solicitud con cero Ticket, más de 10 Ticket o identificadores
      repetidos debe rechazarse completamente con un error de validación, sin
      crear Reservation, Order ni Order ID y sin modificar el inventario.

      El valor máximo será configurable para facilitar pruebas y evolución, pero
      cualquier aumento requerirá verificar nuevamente el tamaño de
      `TransactWriteItems`, la contención, la latencia y el riesgo de acaparamiento
      de inventario. La configuración desplegada para esta implementación será 10.
    impact:
      - TC-011
      - FR-004
      - BR-014
      - AC-014
      - AP-008
      - API-004
      - FG-001

  - id: ADR-004
    type: ADR
    priority: MEDIUM
    title: "Event creation at capacity scale"
    proposal: >
      Creación síncrona en dos fases: Event no habilitado, escritura de Ticket
      por lotes y habilitación condicional final. Un Event incompleto nunca es
      visible ni comprable; los restos se eliminan por compensación y limpieza
      periódica.
    alternatives:
      - Creación asíncrona con aceptación inmediata y consulta de progreso
      - Limitar la capacidad a lo que cabe en una transacción
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se rechaza la creación síncrona y se adopta la creación asíncrona con SQS
      y el rol worker. Con el máximo de 50.000 Ticket por Event aprobado en
      FG-002, la escritura del inventario no debe ejecutarse dentro de la
      solicitud HTTP.

      La solicitud de creación valida completamente los datos, crea el Event en
      una fase técnica `PROVISIONING` no habilitada, publica un mensaje de
      aprovisionamiento y responde de inmediato con el `eventId` y el estado de
      aprovisionamiento. Una solicitud inválida o que supere la capacidad máxima
      se rechaza completa sin escribir nada.

      El inventario se describe mediante una definición compacta (secciones,
      filas y asientos, más las cortesías) y no como una lista de Ticket
      individuales en el cuerpo. El servidor genera los `ticketId` de forma
      determinista a partir de esa definición, que se conserva en el Event. El
      mensaje solo transporta el `eventId`.

      El worker consume el mensaje y escribe los Ticket por lotes con
      concurrencia acotada. La escritura debe ser idempotente por clave y
      reanudable ante una reentrega. Para que una reentrega duplicada no
      sobrescriba Ticket de un Event ya habilitado, el worker debe tomar un
      lease condicional sobre el Event y comprobar que continúa en
      `PROVISIONING` antes de cada lote. El Event se habilita mediante una
      escritura condicional, junto con su registro de auditoría, solo después
      de comprobar que la cantidad de Ticket creados coincide con
      `Event.capacity`.

      Mientras el Event no esté habilitado no aparece en el listado, y la
      consulta de disponibilidad y el inicio de compra lo tratan como
      inexistente. El `ADMIN` puede consultar el estado de aprovisionamiento
      del Event (`PROVISIONING`, `ENABLED` o `FAILED`).

      El aprovisionamiento usa una cola propia con DLQ, separada de la cola de
      Orders, con entrega at-least-once. Agotados los reintentos, el Event se
      marca `FAILED` y el proceso de limpieza elimina sus Ticket. Un Event que
      permanezca en `PROVISIONING` sin progreso más allá del umbral debe ser
      detectado por el mismo proceso y republicado o marcado `FAILED`.

      ADR-004, el modelo de datos, el contrato de mensajería, OpenAPI y la
      especificación funcional deben propagarse de forma consistente con esta
      decisión. AV-002 debe responderse teniendo en cuenta que el estado de
      aprovisionamiento pasa a ser visible para el `ADMIN`.
    impact:
      - FR-001
      - BR-021
      - VAL-009
      - AC-001
      - AC-017
