  - id: ADR-006
    type: ADR
    priority: HIGH
    title: "Persistence plus enqueue"
    proposal: >
      Publicación directa en SQS tras el commit, con compensación síncrona: tras
      3 intentos fallidos o un error no reintentable, el caso de uso de compra
      lleva la Order a FAILED y libera los Ticket, y responde con el Order ID.
      Un marcador `enqueuedAt` permite republicar en una repetición; la
      expiración cubre la caída entre commit y publicación.
    alternatives:
      - Transactional outbox con relay
      - Encolar antes de persistir (descartada por contradecir la especificación)
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma la publicación directa en SQS después del commit de la
      reserva, con compensación síncrona ante un fallo definitivo de encolado:
      el caso de uso de compra lleva la Order a `FAILED`, libera sus Ticket en
      la misma transacción y responde con el Order ID. Se descartan el outbox
      con relay como mecanismo principal y el encolado previo a la persistencia.
      Se añaden dos cambios.

      Presupuesto de tiempo. La ruta de publicación debe tener una duración
      acotada: como máximo 3 intentos, con un timeout por intento de 500 ms y
      backoff con jitter, dentro de un presupuesto total de 2 s. Agotado el
      presupuesto o ante un error no reintentable, el fallo es definitivo y se
      ejecuta la compensación. Los valores serán configurables y los indicados
      son los desplegados para esta implementación. Los reintentos solo ocurren
      en la ruta de fallo y no forman parte del objetivo de latencia de la ruta
      normal.

      Barrido de republicación. Un proceso periódico del rol worker debe
      localizar las Orders en `CREATED` que no tienen `enqueuedAt` y cuya
      creación supera un umbral de 30 s, republicar su mensaje y marcar
      `enqueuedAt`. El umbral debe ser superior al presupuesto de la ruta
      síncrona para no competir con ella. El barrido no republica una Order
      cuyo tiempo restante sea inferior al margen de corte que se apruebe en
      AV-003; esa Order se cierra por expiración. Los mensajes duplicados que
      produzca el barrido son tolerados por el consumidor conforme a ADR-007.

      Las Orders pendientes de encolado se localizan mediante un índice
      disperso. La Order entra en el índice en la transacción de reserva y sale
      al marcarse `enqueuedAt` o al alcanzar un estado terminal. Como toda
      Order pasa por este índice, su partition key debe usar sharding calculado,
      de forma consistente con ADR-001, para no concentrar las escrituras en una
      única partición. Se acepta como trade-off declarado que esto añade
      escrituras de índice a la ruta de compra.

      La marca `enqueuedAt` sigue siendo una escritura condicional cuyo fallo no
      hace fallar la compra; si no llega a aplicarse, el barrido republica y el
      duplicado se descarta. El barrido cubre la caída del proceso entre el
      commit y la publicación y el doble fallo de publicación y compensación. La
      expiración se mantiene como última garantía de que no existe una reserva
      indefinida.
    impact:
