  - id: ADR-009
    type: ADR
    priority: HIGH
    title: "Expiration process"
    proposal: >
      Proceso periódico en el rol worker que cada 5 s consulta un índice
      disperso por instante de expiración y ejecuta la transición condicional a
      EXPIRED. Sin líder ni lock: la condición garantiza un único efecto con
      múltiples instancias.
    alternatives:
      - Expiración nativa del almacenamiento (TTL) con reacción al borrado
      - Mensaje diferido por Reservation
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma el proceso periódico en el rol worker que consulta el índice
      disperso por instante de expiración y ejecuta la transición condicional a
      `EXPIRED`, liberando conjuntamente todos los Ticket de la Order. La
      periodicidad y la demora máxima son las aprobadas en AV-003. Todas las
      instancias del worker ejecutan el proceso sin líder ni lock distribuido;
      las guardas de Order en `CREATED` y de `expiresAt` vencido garantizan un
      único efecto y que no se libere una Reservation vigente. Se descartan la
      expiración por TTL y el mensaje diferido por Reservation. Se añaden dos
      cambios.

      Aislamiento del ciclo de expiración. El worker ejecuta además el barrido
      de republicación de ADR-006, los reversos de pago de FG-003 y la limpieza
      de aprovisionamiento de ADR-004. Cada proceso periódico debe tener su
      propia planificación y su propio límite de concurrencia, de modo que la
      duración o el fallo de uno no retrase a los demás. La expiración es el
      único con un plazo estricto y no debe compartir ciclo con ningún otro.

      Cuarentena. Una Order marcada en cuarentena conforme a ADR-005 debe
      retirarse del índice de expiración, para que el proceso no la reintente en
      cada ciclo.

      Se acepta como trade-off declarado que, sin coordinación entre instancias,
      dos de ellas pueden intentar expirar la misma Order, y que la transacción
      cancelada por condición consume capacidad de escritura. El recorrido
      aleatorio de shards con jitter lo reduce y no se justifica un lock
      distribuido para eliminarlo.
    impact:
