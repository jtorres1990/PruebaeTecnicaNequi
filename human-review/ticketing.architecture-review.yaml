  - id: FG-003
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Qué debe ocurrir cuando el Payment Mock aprueba, o pudo haber aprobado, un pago cuya Order termina sin confirmarse (EXPIRED por vencimiento, o FAILED tras agotar reintentos con resultado desconocido)?"
    recommended: >
      La Order conserva su estado terminal y sus Ticket quedan liberados; el
      sistema solicita al proveedor la cancelación del PaymentAttempt de forma
      idempotente y deja evidencia en la auditoría. Sin esta respuesta, el
      diseño solo registra y alerta la anomalía.
    decision: PENDING
    answer: null
    impact:
