  - id: ADR-009
    type: ADR
    priority: HIGH
    title: "Expiration process"
    proposal: >
      Proceso periódico en el rol worker que cada 5 s consulta un índice
      disperso por instante de expiración y ejecuta la transición condicional a
      EXPIRED. Sin líder ni lock: la condición garantiza un único efecto con
      múltiples instancias.
    alternatives:
      - Expiración nativa del almacenamiento (TTL) con reacción al borrado
      - Mensaje diferido por Reservation
    decision: PENDING
