  - id: FG-001
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Cuál es el máximo de Ticket por Order y qué ocurre con una solicitud que lo supere?"
    recommended: >
      Máximo de 10 Ticket por Order. Una solicitud que lo supere se rechaza con
      error de validación, sin crear Reservation, Order ni Order ID y sin tocar
      el inventario. La especificación solo dice "uno o más"; el mecanismo
      transaccional impone un máximo técnico que se vuelve regla observable.
    decision: PENDING
    answer: null
    impact:
