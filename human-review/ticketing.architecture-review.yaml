  - id: ADR-020
    type: ADR
    priority: MEDIUM
    title: "AWS integration technology for DynamoDB and SQS"
    proposal: >
      Clientes asíncronos del SDK oficial de AWS adaptados a tipos reactivos
      dentro de los adaptadores, con un consumidor reactivo propio de SQS, en
      lugar de una integración de alto nivel cuya compatibilidad no está
      verificada.
    alternatives:
      - Integración de alto nivel de Spring para AWS con listeners declarativos
      - Cliente de mapeo de objetos para DynamoDB
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirman los clientes asíncronos del SDK oficial de AWS adaptados a
      tipos reactivos solo dentro de los adaptadores, el cliente de bajo nivel
      de DynamoDB con mapeo explícito en el adaptador y un consumidor reactivo
      propio de SQS. Se descartan la integración de alto nivel de Spring para
      AWS y el cliente de mapeo de objetos. Se añaden cinco precisiones.

      Dos consumidores. Las colas de Orders y de aprovisionamiento tienen cada
      una su propio bucle reactivo, con concurrencia y apagado ordenado propios,
      conforme a ADR-004, ADR-010 y ADR-018.

      Pausa y reanudación. El bucle del consumidor de Orders y el proceso de
      reversos admiten pausa y reanudación gobernadas por el estado del circuit
      breaker del Payment Mock, conforme a ADR-016.

      Heartbeat de visibilidad. El consumidor de aprovisionamiento extiende la
      visibilidad del mensaje mientras el trabajo progresa, conforme a ADR-010.

      Motivos de cancelación. Las escrituras transaccionales solicitan el item
      que no cumplió la condición, para distinguir un Ticket inexistente de uno
      no disponible y dar prioridad al registro de idempotencia en la carrera
      con la misma clave, conforme a ADR-007 y ADR-016.

      Operaciones adicionales. El adaptador implementa la escritura por lotes
      con reintento de items no procesados (ADR-004) y el conteo en paralelo por
      shards del índice de disponibles (ADR-021).
