  - id: FG-001
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Cuál es el máximo de Ticket por Order y qué ocurre con una solicitud que lo supere?"
    recommended: >
      Máximo de 10 Ticket por Order. Una solicitud que lo supere se rechaza con
      error de validación, sin crear Reservation, Order ni Order ID y sin tocar
      el inventario. La especificación solo dice "uno o más"; el mecanismo
      transaccional impone un máximo técnico que se vuelve regla observable.
    decision: CONFIRMED
    answer: >
      Una Order debe solicitar entre 1 y 10 Ticket individuales, todos del mismo
      Event y sin identificadores repetidos. Si la solicitud incumple cualquiera
      de estas condiciones, se rechaza antes de reservar y no se crea
      Reservation, Order ni Order ID ni se modifica el inventario.
    impact:
      - BR-014
      - FR-004
      - ADR-003
      - ADR-002
      - ADR-005
      - AP-008
      - API-004

  - id: FG-002
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Cuál es la capacidad máxima de un Event y qué ocurre si la creación la supera?"
    recommended: >
      Máximo de 5.000 Ticket por Event. Una creación que lo supere se rechaza
      completa con error de validación. La especificación solo exige capacidad
      mayor que cero; la creación síncrona y la consulta de disponibilidad
      tienen coste proporcional a la capacidad.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Para esta implementación el máximo soportado y verificable será de 50.000
      Ticket individuales por Event. Una solicitud que supere ese máximo se
      rechazará completamente con un error de validación, sin crear parcialmente
      el Event ni sus Ticket.

      La creación de un Event de gran capacidad se procesará mediante escritura
      por lotes bajo una fase técnica de aprovisionamiento. El Event solo quedará
      habilitado para consulta y venta después de comprobar que la cantidad total
      de Ticket creados coincide con `Event.capacity`. La consulta de
      disponibilidad será paginada y no intentará retornar los 50.000 Ticket en
      una única respuesta.

      El límite podrá elevarse posteriormente mediante configuración y nuevas
      pruebas de capacidad, sin cambiar el modelo de particionado por Ticket ni
      las garantías funcionales de reserva atómica.
    impact:
      - VAL-008
      - FR-001
      - FR-012
      - ADR-004
      - ADR-021
      - ADR-001
      - AP-002
      - AP-007
