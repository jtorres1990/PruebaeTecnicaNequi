  - id: ADR-014
    type: ADR
    priority: MEDIUM
    title: "Local identity provider"
    proposal: >
      Emisor OIDC simulado en contenedor que emite tokens con claims de forma
      Cognito; el backend solo depende de emisor, claves y claims. Alternativas
      documentadas: servidor de identidad completo o user pool real por
      configuración.
    alternatives:
      - Cognito emulado por el emulador local de AWS
      - User pool real de Cognito en una cuenta de desarrollo
      - Servidor de identidad completo con mapeo de claims
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma como proveedor local por defecto un emisor OIDC simulado en
      contenedor que emite tokens con los claims de Cognito que valida el
      backend, con el servidor de identidad completo como alternativa
      documentada y el user pool real de Cognito disponible por configuración.
      El backend depende solo de la URL del emisor, la URL de claves y los
      nombres de claims. El emisor local solo existe en el perfil local y las
      pruebas automatizadas de la capa web usan tokens simulados sin depender
      del contenedor. Se añaden dos cambios.

      Identidades para la prueba de carga. Por la regla de una Order activa por
      cliente y por Event y la limitación por tasa por sujeto de ADR-013, la
      prueba de carga requiere más de 1.000 identidades `CUSTOMER` distintas.
      El emisor local debe permitir emitir tokens para sujetos arbitrarios o
      generar de antemano un lote de identidades, y la vigencia de los tokens
      debe cubrir la duración de la prueba.

      Identidades deterministas adicionales. Además del `ADMIN` y los dos
      `CUSTOMER`, el emisor local define una identidad con los grupos `ADMIN` y
      `CUSTOMER`, que puede comprar conforme a AV-005, y una identidad sin
      grupos reconocidos, que debe recibir prohibido en todas las operaciones
      protegidas.
    impact:
      - TC-016
      - TC-012
      - FR-018
      - CMP-020
      - CMP-002
      - RISK-013
      - ADR-013
      - ADR-019
      - AV-005

  - id: ADR-015
    type: ADR
    priority: HIGH
    title: "Clean Architecture structure"
    proposal: >
      Build multi-módulo (`domain`, `application`, `infrastructure`,
      `bootstrap`, `payment-mock`) con la dirección de dependencias impuesta por
      el compilador; puertos de entrada por caso de uso y puertos de salida con
      intención de negocio; una imagen con roles `api` y `worker`.
    alternatives:
      - Módulo único con paquetes por capa y reglas verificadas por pruebas
      - Módulos por funcionalidad, cada uno con sus capas
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma para la aplicación `ticketing` el build multi-módulo
      (`domain`, `application`, `infrastructure`, `bootstrap`) con la dirección
      de dependencias impuesta por el compilador, `domain` y `application` sin
      tipos de Spring, del SDK de AWS ni de HTTP, puertos de entrada por caso de
      uso, puertos de salida con intención de negocio y una única imagen con los
      roles `api` y `worker`. Se descartan el módulo único con paquetes por capa
      y los módulos por funcionalidad. Se añaden tres cambios.

      Payment Mock como proyecto independiente. `payment-mock` no forma parte
      del build de `ticketing`. Es un proyecto independiente dentro del mismo
      repositorio, en su propia carpeta, con su propio build, Dockerfile y
      pruebas, sin código compartido con `ticketing` en ninguna dirección. No
      existe una librería común de DTOs: el adaptador de pago de
      `infrastructure` define sus propios tipos y solo se acopla al contrato
      HTTP del mock, que se documenta en un OpenAPI propio. La aplicación accede
      al mock exclusivamente a través del puerto `Payment gateway` y su
      adaptador HTTP. La cobertura mínima del 90 % se mide solo sobre
      `ticketing`; el mock mantiene sus propias pruebas fuera de esa métrica.
      Docker Compose construye ambos proyectos por separado y la aplicación
      alcanza el mock por nombre de servicio. ADR-011 debe ajustarse de
      "módulo" a "proyecto independiente".

      Puertos actualizados. El catálogo de puertos debe incorporar lo aprobado
      en esta revisión: procesar el aprovisionamiento de un Event y consultar
      su estado, y publicar en la cola de aprovisionamiento (ADR-004); el
      barrido de republicación (ADR-006); el proceso de reversos de pago y la
      operación de cancelación obligatoria en el `Payment gateway` (FG-003); la
      operación de cuarentena y el bloqueo de Order activa por cliente y Event
      como parte de las transiciones del `Order lifecycle store` (ADR-005,
      ADR-013); y la idempotencia de la creación de Events (ADR-007). El rol
      `worker` ejecuta cada proceso periódico con planificación independiente
      conforme a ADR-009.

      Ubicación de las reglas nuevas. La regla de una Order activa por cliente y
      Event, el criterio de cuarentena, la política de reverso de pagos y el
      ciclo de vida del aprovisionamiento (`PROVISIONING`, `ENABLED`, `FAILED`)
      son reglas de negocio y residen en `domain`. El adaptador de DynamoDB solo
      las expresa como condiciones y transacciones, conforme a la regla de
      frontera que separa la decisión de negocio de su atomicidad.
    impact:
      - TC-007
      - TC-013
      - TC-015
      - NFR-012
      - DEL-001
      - CMP-009
      - CMP-021
      - CMP-013
      - CMP-019
      - ADR-004
      - ADR-005
      - ADR-006
      - ADR-007
      - ADR-009
      - ADR-011
      - ADR-013
      - ADR-017
      - ADR-019
      - FG-003
      - AV-006

  - id: ADR-016
    type: ADR
    priority: MEDIUM
    title: "Error model and reactive retry"
    proposal: >
      Problem Details con código estable; errores de dominio tipados traducidos
      en un único punto; retry acotado y localizado en los adaptadores de salida;
      nunca se reintenta un fallo de condición ni un resultado de negocio.
    alternatives:
      - Cuerpo de error propio y retry genérico en los casos de uso
      - Excepciones con anotaciones de estado HTTP en el dominio
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma el modelo de error con Problem Details, un `code` estable y
      `traceId`, sin trazas ni detalles técnicos; errores de dominio como
      jerarquía cerrada traducida a HTTP en un único punto con mapeo
      exhaustivo; y retry selectivo localizado en los adaptadores de salida,
      sin apilar reintentos donde reintenta el SDK y sin reintentar nunca un
      fallo de condición, una validación ni un rechazo de pago. Se descartan el
      cuerpo de error propio con retry genérico y las anotaciones HTTP en el
      dominio. Se añaden los siguientes cambios.

      Alineación con decisiones aprobadas. La publicación en SQS usa el
      presupuesto de ADR-006: 3 intentos, 500 ms por intento y 2 s en total. Se
      añade `ACTIVE_ORDER_EXISTS` con 409 para una segunda compra con una Order
      activa en el mismo Event conforme a ADR-013. `EVENT_NOT_ON_SALE` deja de
      ser condicional conforme a FG-005. La creación de un Event responde 202
      con la ubicación de su estado de aprovisionamiento conforme a ADR-004, y
      su repetición con la misma `Idempotency-Key` responde 200 con cabecera de
      repetición y el estado actual conforme a ADR-007;
      `IDEMPOTENCY_KEY_REUSED` aplica también a esta operación. Un cursor de
      paginación inválido produce `VALIDATION_ERROR` conforme a ADR-021. Los
      presupuestos de la llamada de pago se mantienen.

      Circuit breaker. Se incorpora un circuit breaker para el Payment Mock y
      otro para la publicación en SQS. DynamoDB no tiene circuit breaker: es la
      fuente de verdad y se protege con el retry del SDK y backpressure. La
      composición, de adentro hacia afuera, es timeout, circuit breaker y retry:
      cada intento cuenta para la estadística del circuito y el retry no
      reintenta cuando el circuito está abierto. Solo cuentan como fallo los
      errores transitorios (timeout, conexión y 5xx); un rechazo de pago o un
      error de contrato no abren el circuito.

      Con el circuito del Payment Mock abierto, el consumidor de Orders y el
      proceso de reversos dejan de recibir mensajes, de modo que no consumen
      recepciones de `maxReceiveCount`. En semiabierto se procesan unos pocos
      mensajes de prueba y, si tienen éxito, se reanuda el consumo. La
      expiración continúa en su ciclo independiente conforme a ADR-009 y
      ADR-008.

      Con el circuito de publicación en SQS abierto, la API rechaza la compra
      síncronamente con `SERVICE_UNAVAILABLE` (503) y `Retry-After`, antes de
      reservar, sin crear Reservation, Order ni Order ID y sin modificar el
      inventario. Con el circuito cerrado o semiabierto se mantiene la ruta de
      Order `FAILED` por fallo definitivo de encolado conforme a ADR-006.

      Valores iniciales configurables. Payment Mock: ventana de las últimas 20
      llamadas con un mínimo de 10, apertura con 50 % de fallos o de llamadas
      de más de 2 s, 15 s abierto y 3 llamadas de prueba. Publicación en SQS:
      ventana de las últimas 20 llamadas con un mínimo de 10, apertura con 50 %
      de fallos, 10 s abierto y 2 llamadas de prueba.

      Implementación. El retry usa operadores nativos de Reactor con backoff y
      jitter. El circuit breaker usa Resilience4j con su módulo de Reactor,
      sujeto a verificar compatibilidad con Spring Boot 4.x y Java 25; si no es
      compatible, se implementa un circuito mínimo propio en el adaptador. Ambos
      residen en los adaptadores de `infrastructure`; el caso de uso solo
      recibe un resultado tipado de dependencia no disponible, conforme a
      ADR-015. El estado del circuito es por instancia. Se publica una métrica
      del estado de cada circuito con alarma al abrirse. Las transiciones se
      prueban con tiempo virtual y se demuestran con los fallos transitorios
      del Payment Mock conforme a ADR-011.
    impact:
      - TC-008
      - TC-009
      - NFR-003
      - ERR-002
      - ERR-005
      - ERR-006
      - ERR-009
      - CMP-016
      - API-001
      - API-004
      - API-005
      - ADR-004
      - ADR-006
      - ADR-007
      - ADR-008
      - ADR-009
      - ADR-010
      - ADR-011
      - ADR-013
      - ADR-015
