  - id: ADR-006
    type: ADR
    priority: HIGH
    title: "Persistence plus enqueue"
    proposal: >
      Publicación directa en SQS tras el commit, con compensación síncrona: tras
      3 intentos fallidos o un error no reintentable, el caso de uso de compra
      lleva la Order a FAILED y libera los Ticket, y responde con el Order ID.
      Un marcador `enqueuedAt` permite republicar en una repetición; la
      expiración cubre la caída entre commit y publicación.
    alternatives:
      - Transactional outbox con relay
      - Encolar antes de persistir (descartada por contradecir la especificación)
