      - AP-003

  - id: AV-003
    type: ARCHITECTURE_VALIDATION
    priority: HIGH
    question: "¿Se aceptan (a) la periodicidad de 5 s y la demora máxima objetivo de 15 s para liberar los Ticket después de `expiresAt`, (b) la guarda temporal estricta que impide confirmar una compra después de `expiresAt`, y (c) el margen de corte de 15 s por debajo del cual no se inicia un pago?"
    recommended: >
      Sí a las tres. La Reservation deja de poder confirmarse exactamente a los
      diez minutos; los Ticket pueden permanecer retenidos unos segundos más
      hasta que actúa el proceso periódico; una Order encolada con mucho retraso
      expira sin intento de pago.
    decision: PENDING
    answer: null
    impact:
