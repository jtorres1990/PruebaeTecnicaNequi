  - id: ADR-005
    type: ADR
    priority: HIGH
    title: "Order, Reservation and Ticket consistency per state transition"
    proposal: >
      Cada transición de negocio es una única escritura transaccional que
      incluye la Order, todos sus Ticket y el registro de auditoría. Toda
      transición terminal exige Order en CREATED; toda transición de Ticket
      exige que pertenezca a la Order. Sin estados de negocio nuevos.
    alternatives:
      - Saga con pasos compensables y estados técnicos intermedios
      - Order como fuente única con estado de Ticket derivado
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma que cada transición de negocio se ejecuta como una única
      operación `TransactWriteItems` que incluye la Order, todos sus Ticket y el
      registro de auditoría, sin estados de negocio nuevos ni estados técnicos
      intermedios observables. Se descartan la saga y el estado de Ticket
      derivado.

      Toda transición terminal exige condicionalmente que la Order esté en
      `CREATED`. Toda transición de un Ticket posterior a la reserva exige que
      el Ticket pertenezca a la Order que la ejecuta y se encuentre en el estado
      de origen esperado. Ninguna condición admite `SOLD` ni `COMPLIMENTARY`
      como origen. El fallo de una condición no es un error técnico: el ejecutor
      relee la Order y actúa según su estado actual.

      Las transacciones deben usar las claves de Ticket aprobadas en ADR-001:
      los Ticket de una Order residen en partition keys diferentes y la
      transacción los actualiza junto con la Order. Con el máximo de 10 Ticket
      por Order de ADR-003, ninguna transición supera 13 items.

      La atomicidad se garantiza para la escritura. Una lectura no transaccional
      de varios items puede observar unos antes y otros después del commit, por
      lo que la consulta de una Order debe resolverse leyendo únicamente el item
      Order con lectura fuertemente consistente y no debe componer el estado
      individual de sus Ticket. La consulta de disponibilidad se mantiene como
      informativa.

      Si la transacción se cancela por la condición de un Ticket mientras la
      Order continúa en `CREATED`, se trata como una inconsistencia: se audita,
      se alerta y no se fuerza ninguna escritura sobre los Ticket. Para evitar
      que el proceso de expiración la reintente indefinidamente, la Order debe
      marcarse con un atributo técnico de cuarentena que la retire del índice de
      expiración y la deje disponible para revisión manual. Este atributo no es
      un estado de negocio y no se expone.

      Se acepta como trade-off declarado que las escrituras transaccionales
      consumen el doble de capacidad y que una compra confirmada requiere tres
      transacciones. Los márgenes temporales de las guardas se resuelven en
      AV-003 y ADR-008, y el tratamiento de un pago aprobado sin confirmar en
      FG-003.
    impact:
