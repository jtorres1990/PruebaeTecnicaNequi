  - id: ADR-001
    type: ADR
    priority: HIGH
    title: "DynamoDB data model"
    proposal: >
      Tabla única `ticketing` con claves genéricas PK/SK, tres GSIs dispersos
      (Events por fecha, Ticket disponibles, Reservation activas por expiración),
      Reservation y PaymentAttempt co-localizados en el item Order, consistencia
      definida por access pattern y capacidad on-demand.
    alternatives:
      - Una tabla por entidad (events, tickets, orders, idempotency, audit)
      - Ticket con partition key propia e índice por Event
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se conserva una sola tabla DynamoDB, pero se rechaza que todos los Ticket
      de un Event compartan `PK = EVENT#<eventId>`. Cada Ticket debe utilizar
      una partition key de alta cardinalidad y direccionable de forma
      determinista, por ejemplo `PK = TICKET#<eventId>#<ticketId>` y
      `SK = #META`. Esto distribuye entre particiones las compras concurrentes
      de tickets distintos de un mismo Event.

      La disponibilidad por Event debe resolverse mediante un GSI con sharding
      calculado. El shard se deriva de forma determinista del ticket y el Event
      conserva la cantidad de shards configurada. Las consultas de
      disponibilidad deben ser paginadas y, cuando aplique, filtrables por
      sección; no se retornarán decenas de miles de tickets en una sola
      respuesta.

      La reserva all-or-nothing se mantiene mediante una única operación
      transaccional que puede actualizar Ticket ubicados en particiones
      diferentes, además de crear Order, Reservation, idempotencia y auditoría.
      Cada Ticket debe validar condicionalmente que pertenece al Event solicitado
      y que continúa en `AVAILABLE`.

      El diseño debe soportar como mínimo un Event con 50.000 Ticket y una prueba
      concentrada con más de 1.000 usuarios concurrentes. La creación de Events
      de gran capacidad debe realizar la escritura de tickets por lotes antes de
      habilitar el Event. El modelo, ADR-004, ADR-021 y OpenAPI deben propagarse
      de forma consistente con esta decisión.
    impact:
      - TC-004
      - NFR-006
      - FR-003
      - FR-012
      - AP-004
      - AP-005
      - AP-007
      - AP-008
      - AP-010
