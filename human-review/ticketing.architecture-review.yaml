  - id: ADR-010
    type: ADR
    priority: HIGH
    title: "SQS operational policy"
    proposal: >
      Cola Standard con DLQ; long polling de 20 s; visibility timeout de 60 s;
      máximo de 5 recepciones con backoff por visibilidad; el consumidor cierra
      la Order como FAILED en su última recepción; la DLQ es zona de retención
      con alarma y redrive manual.
    alternatives:
      - Consumidor automático de la DLQ que cierra la Order
      - Sin DLQ, reintento hasta el fin de la retención
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma para la cola de Orders la cola Standard con DLQ, long polling
      de 20 s, visibility timeout de 60 s, tope de procesamiento de 30 s, lease
      de PaymentAttempt de 45 s y un máximo de 5 recepciones con backoff
      aplicado mediante la visibilidad del mensaje. En la última recepción, si
      el procesamiento vuelve a fallar, el consumidor cierra la Order como
      `FAILED` y libera sus Ticket. La DLQ es zona de retención para
      diagnóstico, con alarma y redrive manual. Se descartan el consumidor
      automático de la DLQ y la operación sin DLQ. Se añaden dos cambios.

      Cola de aprovisionamiento. La cola creada en ADR-004 debe tener su propia
      política: cola Standard con DLQ propia, visibility timeout de 120 s
      extendido mediante heartbeat mientras el aprovisionamiento progresa,
      máximo de 5 recepciones y concurrencia baja por instancia para no competir
      con la capacidad de las compras. Agotadas las recepciones, el Event queda
      en `FAILED` conforme a ADR-004.

      Capacidad de consumo. Una Order que espera en cola más allá del margen de
      corte de AV-003 expira sin intento de pago, por lo que la capacidad de
      consumo debe dimensionarse para que la espera en cola sea muy inferior a
      la vigencia de la Reservation. La concurrencia por instancia será
      configurable; se publicará la métrica de antigüedad del mensaje más
      antiguo de la cola de Orders con alarma a los 2 minutos; el worker
      escalará automáticamente según los mensajes pendientes; y la prueba de
      carga debe verificar que ninguna Order expira por espera en cola.

      Los valores indicados serán configurables y son los desplegados para esta
      implementación.
    impact:
