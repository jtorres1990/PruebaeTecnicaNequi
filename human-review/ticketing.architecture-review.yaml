  - id: ADR-017
    type: ADR
    priority: LOW
    title: "Local topology"
    proposal: >
      Docker Compose con DynamoDB Local, LocalStack (SQS), emisor de identidad
      local, Payment Mock, una tarea de inicialización de un solo uso y la
      aplicación como dos contenedores de la misma imagen (`ticketing-api`,
      `ticketing-worker`).
    alternatives:
      - Un único contenedor de aplicación con todos los roles que crea sus recursos al arrancar
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma la topología local con la misma forma que el objetivo en AWS:
      `ticketing-api` y `ticketing-worker` como dos contenedores de la misma
      imagen, recursos creados por una tarea `infra-init` de un solo uso e
      idempotente, comprobaciones de salud con dependencias explícitas,
      configuración por variables de entorno con un archivo de ejemplo
      versionado, imágenes multi-etapa con usuario sin privilegios y perfil
      opcional de prueba de carga. Se descarta el contenedor único que crea sus
      propios recursos. Se añaden cuatro cambios.

      Recursos de `infra-init`. Además de la tabla y la cola de Orders con su
      DLQ, `infra-init` crea el GSI de Ticket disponibles con sharding (ADR-001,
      ADR-021), el índice de Orders pendientes de encolado (ADR-006), el índice
      de reversos de pago (FG-003) y la cola de aprovisionamiento con su DLQ y
      política de redrive (ADR-004, ADR-010).

      Payment Mock. `payment-mock` se construye desde su propia carpeta y build,
      independiente del build de `ticketing`, conforme a ADR-015.

      Identidades para la prueba de carga. `local-idp` emite tokens para
      sujetos arbitrarios conforme a ADR-014, y el perfil de prueba de carga
      incluye un paso previo que genera más de 1.000 tokens `CUSTOMER`
      distintos.

      LocalStack. Desde el 23 de marzo de 2026 la imagen
      `localstack/localstack:latest` exige `LOCALSTACK_AUTH_TOKEN` para
      arrancar. Para que el entorno se levante sin cuentas externas, LocalStack
      se fija a un tag publicado antes de esa exigencia, que se verificará como
      primera tarea del desarrollo, incluyendo el soporte de redrive a DLQ, el
      contador aproximado de recepciones y el cambio de visibilidad. El README
      documenta como alternativa el uso de la versión actual con un token
      gratuito suministrado por un archivo no versionado, nunca incluido en el
      repositorio conforme a ADR-013. Si el tag fijado no cumple, el respaldo es
      ElasticMQ, previa revisión de HV-010 en la especificación funcional.
