  - id: AV-001
    type: ARCHITECTURE_VALIDATION
    priority: MEDIUM
    question: "¿Es aceptable que el listado de Events informe un indicador `soldOut` en lugar de la cantidad exacta de Ticket disponibles?"
    recommended: >
      Sí. AC-002 pide marcar el Event agotado con disponibilidad cero; un
      indicador booleano lo cumple con coste constante. La cantidad exacta está
      disponible en la consulta de disponibilidad del Event. Si se exige la
      cantidad en el listado, el coste por Event pasa a ser proporcional a sus
      Ticket disponibles.
    decision: CONFIRMED
    answer: >
      Sí. El listado informa un indicador `soldOut` por Event y no la cantidad
      exacta de Ticket disponibles. La cantidad está disponible en la consulta
      de disponibilidad del Event conforme a ADR-021.
    impact:
      - AC-002
      - FR-002
      - ADR-021
      - ADR-001
      - API-002
      - AP-005

  - id: AV-002
    type: ARCHITECTURE_VALIDATION
    priority: MEDIUM
    question: "¿Es correcto interpretar \"Event habilitado\" como \"creación completada\", mediante un atributo técnico y sin operación para habilitar o deshabilitar un Event?"
    recommended: >
      Sí. HV-020 dejó a arquitectura la evaluación de un estado de habilitación.
      El atributo `enabled` es técnico, no se expone y solo cambia una vez, al
      terminar de escribir el inventario.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      "Event habilitado" significa que su creación se completó: el Event está en
      `ENABLED`. Conforme a ADR-004 y AV-005, el ciclo de aprovisionamiento
      (`PROVISIONING`, `ENABLED`, `FAILED`) deja de ser un atributo no expuesto
      y es visible para el `ADMIN`. Para el `CUSTOMER`, un Event que no está en
      `ENABLED` no existe. No existe operación manual para habilitar ni
      deshabilitar un Event, y el Event es inmutable una vez habilitado.
    impact:
      - FR-001
      - FR-002
      - BR-022
      - ADR-004
      - API-001
      - API-002
      - AP-003

  - id: AV-003
    type: ARCHITECTURE_VALIDATION
    priority: HIGH
    question: "¿Se aceptan (a) la periodicidad de 5 s y la demora máxima objetivo de 15 s para liberar los Ticket después de `expiresAt`, (b) la guarda temporal estricta que impide confirmar una compra después de `expiresAt`, y (c) el margen de corte de 15 s por debajo del cual no se inicia un pago?"
    recommended: >
      Sí a las tres. La Reservation deja de poder confirmarse exactamente a los
      diez minutos; los Ticket pueden permanecer retenidos unos segundos más
      hasta que actúa el proceso periódico; una Order encolada con mucho retraso
      expira sin intento de pago.
    decision: CONFIRMED
    answer: >
      Se aceptan las tres. (a) El proceso de expiración se ejecuta cada 5 s y
      los Ticket deben liberarse como máximo 15 s después de `expiresAt`. (b) La
      guarda temporal es estricta: ninguna compra se confirma después de
      `expiresAt`, aunque sus Ticket todavía no hayan sido liberados. (c) No se
      inicia un pago cuando faltan menos de 15 s para `expiresAt`; esa Order se
      cierra por expiración. Los tres valores serán configurables y los
      indicados son los desplegados para esta implementación.
    impact:
