  - id: ADR-005
    type: ADR
    priority: HIGH
    title: "Order, Reservation and Ticket consistency per state transition"
    proposal: >
      Cada transición de negocio es una única escritura transaccional que
      incluye la Order, todos sus Ticket y el registro de auditoría. Toda
      transición terminal exige Order en CREATED; toda transición de Ticket
      exige que pertenezca a la Order. Sin estados de negocio nuevos.
    alternatives:
      - Saga con pasos compensables y estados técnicos intermedios
      - Order como fuente única con estado de Ticket derivado
