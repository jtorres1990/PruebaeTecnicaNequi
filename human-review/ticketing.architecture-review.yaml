  - id: ADR-002
    type: ADR
    priority: HIGH
    title: "Atomic multi-ticket reservation"
    proposal: >
      Conditional writes sobre el estado de cada Ticket, agrupados en una única
      escritura transaccional que además crea la Order con su Reservation, el
      registro de idempotencia y el registro de auditoría. El Event queda fuera
      de la transacción.
    alternatives:
      - Optimistic locking con atributo de versión y lectura previa
      - Conditional writes independientes por Ticket con compensación
    decision: PENDING
    answer: null
    impact:
