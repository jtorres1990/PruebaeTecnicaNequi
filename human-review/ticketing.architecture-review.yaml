  - id: ADR-018
    type: ADR
    priority: MEDIUM
    title: "AWS target topology"
    proposal: >
      ECS sobre Fargate con servicios `api` y `worker` en subredes privadas,
      balanceador público con firewall de aplicación, endpoints privados,
      roles de tarea de mínimo privilegio, autoescalado independiente y una
      cuenta por entorno.
    alternatives:
      - Funciones sin servidor con gateway de API e integración nativa de la cola
      - Kubernetes gestionado
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma la topología objetivo con ECS sobre Fargate y dos servicios,
      `api` y `worker`, de la misma imagen; balanceador público con TLS y
      firewall de aplicación con reglas por tasa; tareas en subredes privadas
      con endpoints privados; un rol de tarea de mínimo privilegio por servicio;
      gestor de secretos; DynamoDB on-demand con cifrado y PITR; SQS Standard
      con cifrado y DLQ; Cognito como emisor; autoescalado independiente;
      observabilidad con logs, métricas, trazas y alarmas; y una cuenta de AWS
      por entorno. El Payment Mock solo se despliega en entornos no
      productivos. Se descartan las funciones sin servidor y Kubernetes
      gestionado. Se añaden cinco cambios.

      Escalado del worker. Además de los mensajes pendientes por tarea, el
      worker escala según la antigüedad del mensaje más antiguo de la cola de
      Orders conforme a ADR-010, que es la señal que protege la vigencia de la
      Reservation.

      Apagado ordenado. Ante la señal de parada de la tarea, el `api` deja de
      aceptar solicitudes y completa las que están en curso, incluida la
      publicación en SQS, lo que reduce la ventana de ADR-006 durante
      despliegues y reducciones de escala. El `worker` deja de recibir mensajes
      y completa los que tiene en vuelo dentro del tiempo de parada de la
      tarea.

      Control de bots. El firewall de aplicación incorpora control de bots como
      mitigación del acaparamiento mediante varias cuentas que ADR-013 deja al
      borde, aceptando su costo como trade-off declarado.

      Catálogo de alarmas. Se definen alarmas sobre la profundidad de las DLQ de
      Orders y de aprovisionamiento, la antigüedad del mensaje más antiguo, el
      retraso de expiración, la apertura de cada circuit breaker, los reversos
      de pago pendientes o agotados, las Orders en cuarentena y los
      aprovisionamientos fallidos.

      Mejoras de producción declaradas. La captura de cambios de DynamoDB hacia
      almacenamiento con bloqueo de objetos para la auditoría (ADR-012) y el
      precalentamiento de la capacidad de la tabla y sus índices antes de una
      venta masiva mediante warm throughput, cuya configuración vigente debe
      verificarse.
    impact:
