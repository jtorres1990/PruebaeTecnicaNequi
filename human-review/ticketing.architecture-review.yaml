      - API-003

  - id: FG-003
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Qué debe ocurrir cuando el Payment Mock aprueba, o pudo haber aprobado, un pago cuya Order termina sin confirmarse (EXPIRED por vencimiento, o FAILED tras agotar reintentos con resultado desconocido)?"
    recommended: >
      La Order conserva su estado terminal y sus Ticket quedan liberados; el
      sistema solicita al proveedor la cancelación del PaymentAttempt de forma
      idempotente y deja evidencia en la auditoría. Sin esta respuesta, el
      diseño solo registra y alerta la anomalía.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La Order conserva su estado terminal y sus Ticket quedan liberados; una
      aprobación tardía nunca reabre ni confirma la Order. El sistema debe
      reversar el pago: la transición que cierra una Order con un PaymentAttempt
      activo cuyo resultado fue aprobado o es desconocido la marca como
      pendiente de reverso en la misma escritura transaccional. El worker
      solicita al proveedor la cancelación del PaymentAttempt, con reintento
      acotado, y al confirmarla retira la marca y deja un registro de auditoría.
      Un reverso que agote sus reintentos se alerta y queda pendiente para
      revisión manual.

      La cancelación debe ser idempotente por `paymentAttemptId` y válida
      cualquiera que sea el estado del intento en el proveedor: aprobado,
      rechazado, inexistente o aún en tránsito. Se añade una regla para el
      resultado desconocido: una cancelación que llega antes que el cobro
      original debe quedar registrada por el proveedor, que rechazará cualquier
      cobro posterior con ese mismo `paymentAttemptId`. Sin esta regla, un cobro
      en tránsito podría aprobarse después de la cancelación y quedar sin
      reverso.

      El puerto de pago y el Payment Mock deben incorporar la operación de
      cancelación con este comportamiento.
    impact:
      - AC-019
      - BR-003
      - FR-015
      - FR-017
      - ADR-008
      - ADR-005
      - ADR-010
      - ADR-011
      - ADR-012
      - CMP-007
      - CMP-013
      - CMP-019

  - id: FG-004
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "Una repetición con la misma idempotency key de una solicitud de compra que fue rechazada síncronamente por indisponibilidad, ¿debe devolver el mismo rechazo o reevaluarse?"
    recommended: >
      Reevaluarse. Por HC-001 el rechazo no persiste nada, de modo que no existe
      un resultado previo con efectos que conservar; la repetición puede crear
      una Order si los Ticket volvieron a estar disponibles. La alternativa es
      persistir también los rechazos y devolverlos durante la vigencia de la
      clave.
    decision: CONFIRMED
    answer: >
      La repetición se reevalúa. Un rechazo síncrono por indisponibilidad no
      persiste Reservation, Order ni registro de idempotencia, por lo que no
      existe un resultado previo que conservar. Una repetición con la misma
      idempotency key se procesa como una solicitud nueva y puede crear una
      Order si los Ticket volvieron a estar disponibles; en ese caso la clave
      queda registrada junto con esa Order. Los rechazos no se persisten.
    impact:
      - BR-019
      - FR-017
      - ALT-003
      - ADR-007
      - ADR-002
      - ADR-016
      - AP-009
      - API-004

  - id: FG-005
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Puede iniciarse una compra sobre un Event cuya fecha y hora ya pasaron, y qué debe devolver la consulta de disponibilidad de ese Event?"
    recommended: >
      La compra se rechaza síncronamente sin crear Reservation, Order ni Order
      ID. La consulta de disponibilidad por identificador sigue respondiendo; la
      especificación solo excluye los Events pasados del listado normal.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      No. La compra sobre un Event pasado se rechaza síncronamente, sin crear
      Reservation, Order ni Order ID y sin modificar el inventario. La consulta
      de disponibilidad por identificador de un Event pasado sigue respondiendo
      de forma informativa; el Event solo se excluye del listado normal.

      Un Event es pasado cuando su `startsAt` es menor o igual al instante
      actual del servidor, en UTC, al recibir la solicitud de compra. Es el
      mismo criterio que lo excluye del listado. La validación se realiza sobre
      el Event antes de la transacción de reserva, conforme a ADR-002, sin
      guardas adicionales dentro de ella.

      Una Reservation creada antes de `startsAt` puede confirmarse dentro de su
      vigencia aunque el Event haya comenzado. No se añade una guarda sobre
      `startsAt` en la confirmación. Se declara como comportamiento aceptado.

      El rechazo usa un código funcional propio, por ejemplo
      `EVENT_NOT_ON_SALE`, distinto del rechazo por indisponibilidad de Ticket;
      el status HTTP se define en ADR-016. Un Event en `PROVISIONING` o `FAILED`
      sigue tratándose como inexistente conforme a ADR-004.
