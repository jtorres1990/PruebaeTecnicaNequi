  - id: ADR-011
    type: ADR
    priority: MEDIUM
    title: "Payment Mock"
    proposal: >
      Servicio HTTP propio e independiente, idempotente por `paymentAttemptId`,
      cuyo resultado se selecciona de forma determinista mediante reglas
      configuradas en el propio mock; desplegado como contenedor en Docker
      Compose.
    alternatives:
      - Servidor de stubs genérico configurado por archivos
      - Resultado seleccionado por un campo de la solicitud de compra
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma el Payment Mock como servicio HTTP propio, idempotente por
      `paymentAttemptId`, con selección determinista del resultado mediante
      reglas configuradas en el propio mock a través de una API de control, con
      los comportamientos de aprobación, rechazo, error definitivo, errores
      transitorios seguidos de un resultado final y latencia añadida, estado en
      memoria y contenedor propio en Docker Compose. Se descartan el servidor
      de stubs genérico y la selección por un campo de la solicitud de compra.
      Se añaden cuatro cambios.

      Proyecto independiente. Conforme a ADR-015, el mock es un proyecto
      independiente dentro del mismo repositorio, con su propio build,
      Dockerfile y pruebas, y su contrato HTTP se documenta en un OpenAPI
      propio. No es un módulo del build de `ticketing`.

      Cancelación obligatoria. Conforme a FG-003, el mock expone la operación
      de cancelación de un PaymentAttempt. Es idempotente por `paymentAttemptId`
      y responde correctamente cualquiera que sea el estado del intento:
      aprobado, rechazado, inexistente o aún en tránsito.

      Cancelación anticipada. Si la cancelación llega antes que el cobro, el
      mock la registra y rechaza cualquier cobro posterior con el mismo
      `paymentAttemptId`.

      Inspección de cancelaciones. La API de control permite consultar también
      las cancelaciones recibidas por intento, para verificar en pruebas que un
      pago aprobado sin compra se reversa exactamente una vez.
    impact:
      - TC-017
      - FR-015
      - AC-019
      - AC-020
      - AC-021
      - CMP-013
      - CMP-019
      - AV-004
      - FG-003
      - ADR-015
      - ADR-017

  - id: ADR-012
    type: ADR
    priority: MEDIUM
    title: "Audit trail"
    proposal: >
      Un registro de auditoría de solo inserción por transición de negocio,
      escrito en la misma escritura transaccional que la transición y guardado
      en la colección de la Order o del Event.
    alternatives:
      - Captura de cambios del almacén hacia un destino de auditoría
      - Registro de aplicación mediante logs estructurados
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma un registro de auditoría de solo inserción por transición de
      negocio, escrito en la misma escritura transaccional que la transición y
      guardado en la colección de la Order, o del Event para su creación. El
      registro contiene las transiciones aplicadas, los estados de origen y
      destino de la Order y de sus Ticket, la causa funcional, el actor, la
      correlación y el instante en UTC, sin tokens ni datos personales más allá
      del identificador de sujeto. No se expone una operación de API de
      consulta. Se descartan la captura de cambios como mecanismo primario y los
      logs estructurados como evidencia. Se añaden dos cambios.

      Catálogo de causas. Además de las causas originales, se auditan: la
      solicitud de reverso de un pago y su confirmación o agotamiento (FG-003),
      la aprobación tardía que no pudo aplicarse (ADR-008), la puesta en
      cuarentena de una Order (ADR-005) y el aprovisionamiento fallido de un
      Event (ADR-004). La republicación del barrido de ADR-006 no es una
      transición de negocio y queda en logs y métricas.

      Inmutabilidad. Dentro de la tabla, la inmutabilidad es una convención de
      la aplicación respaldada por PITR. Como los registros comparten partition
      key con su Order, los permisos IAM no pueden impedir su modificación sin
      impedir también la actualización de la Order. La garantía fuerte de
      inmutabilidad en AWS se declara como mejora de producción mediante la
      captura de cambios hacia almacenamiento con bloqueo de objetos y
      retención.
    impact:
      - FR-014
      - BR-010
      - NFR-005
      - AC-015
      - AP-017
      - CMP-010
      - RISK-015

  - id: ADR-013
    type: ADR
    priority: HIGH
    title: "Security"
    proposal: >
      Validación del JWT en la aplicación como Resource Server; `cognito:groups`
      mapeado a autoridades ADMIN y CUSTOMER; propietario tomado del sujeto del
      JWT; Order ajena e inexistente producen la misma respuesta; secretos fuera
      del repositorio; idempotencia, límites de entrada y limitación por tasa
      contra abuso.
    alternatives:
      - Validación delegada exclusivamente al borde
      - Autorización por propiedad impuesta por la clave de persistencia
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma la validación del JWT en la aplicación como Resource Server
      (firma, emisor, expiración, tipo de token de acceso y cliente permitido),
      el mapeo de `cognito:groups` a las autoridades `ADMIN` y `CUSTOMER`, la
      autorización por rol en el punto de entrada y por propiedad en el caso de
      uso, el propietario tomado siempre del sujeto del JWT, y la respuesta
      idéntica para una Order ajena y una inexistente. Se confirman el manejo de
      secretos fuera del repositorio, sin claves estáticas en AWS y sin registrar
      tokens ni API keys, y las defensas contra abuso por idempotencia, límites
      de entrada y limitación por tasa. Se descartan la validación delegada
      exclusivamente al borde y la propiedad impuesta por la clave de
      persistencia. Se añaden cuatro cambios.

      Operaciones nuevas. La consulta del estado de aprovisionamiento de un
      Event introducida en ADR-004 requiere la autoridad `ADMIN`. La
      `Idempotency-Key` de la creación de Events introducida en ADR-007 se
      vincula al sujeto del `ADMIN` autenticado. La tabla de autorización por
      operación y OpenAPI deben incluirlas.

      Tamaño de cuerpo. Con la definición compacta del inventario aprobada en
      ADR-004, ninguna operación necesita cuerpos de varios MB. El límite de
      cuerpo en memoria del servidor se mantiene bajo y explícito, y una
      solicitud que lo supere se rechaza sin procesarse.

      Endpoints de gestión. Solo el endpoint de salud puede ser accesible desde
      el exterior. Las métricas y el resto de endpoints de gestión se exponen en
      un puerto interno, no publicado por el balanceador, y no deben revelar
      configuración ni secretos.

      Una Order activa por cliente y por Event. Un `CUSTOMER` no puede tener más
      de una Order en `CREATED` para el mismo Event. La transacción de reserva
      crea un item de bloqueo identificado por cliente y Event con la condición
      de que no exista, y toda transición terminal lo elimina en la misma
      escritura transaccional, conforme a ADR-005. Una segunda solicitud de
      compra para el mismo Event mientras la primera está activa se rechaza
      síncronamente, sin crear Reservation, Order ni Order ID y sin modificar el
      inventario. Una repetición con la misma `Idempotency-Key` sigue
      resolviéndose como repetición conforme a ADR-007 y no como segunda compra.
      Se acepta como limitación declarada que esta regla no impide el
      acaparamiento mediante varias cuentas, que queda a cargo del control de
      bots en el borde, y que una Order en cuarentena mantiene el bloqueo hasta
      su revisión manual. Esta regla funcional debe propagarse a la
      especificación funcional.
    impact:
