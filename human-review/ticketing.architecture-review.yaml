  - id: ADR-021
    type: ADR
    priority: MEDIUM
    title: "Availability and inventory read model"
    proposal: >
      La disponibilidad se deriva siempre de los Ticket: lectura eventual de la
      colección del Event para la consulta, y un sondeo de coste constante sobre
      un índice disperso para marcar Events agotados en el listado. Sin
      contadores persistidos.
    alternatives:
      - Contador de disponibles en el item Event actualizado en cada transacción
      - Contador mantenido fuera de la transacción o por captura de cambios
      - Instantánea en caché de corta vida
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma que la disponibilidad se deriva siempre de los Ticket, sin
      contadores persistidos. Se descartan el contador en el item Event, el
      contador mantenido fuera de la transacción o por captura de cambios y la
      instantánea en caché como modelo base. Se rechaza la lectura completa de
      la colección del Event en una sola respuesta, incompatible con ADR-001 y
      con la capacidad de 50.000 Ticket aprobada en FG-002.

      La fuente de lectura es el GSI disperso de Ticket en `AVAILABLE`, con
      sharding calculado conforme a ADR-001. La cantidad de shards de cada Event
      se deriva de su capacidad y se conserva en el Event.

      La consulta de disponibilidad de un Event retorna la cantidad de Ticket
      disponibles y una página de Ticket disponibles. La página es paginada por
      cursor, filtrable por sección y con tamaño máximo acotado, y solo contiene
      Ticket en `AVAILABLE`. La respuesta deja de listar los Ticket en otros
      estados.

      La cantidad disponible se calcula mediante un conteo en paralelo sobre
      los shards del índice, cacheado durante 1 s por instancia y compartido
      entre solicitudes simultáneas del mismo Event. La respuesta incluye
      `generatedAt` y se declara informativa conforme a BR-018; la compra
      revalida en la transacción conforme a ADR-002.

      El listado marca los Events agotados mediante un sondeo con límite 1
      sobre los shards del índice, que se detiene en el primer resultado,
      conforme a AV-001. La consulta de un Event pasado sigue respondiendo
      conforme a FG-005, y un Event no habilitado se trata como inexistente
      para el `CUSTOMER` conforme a ADR-004. OpenAPI y el modelo de datos deben
      propagarse de forma consistente con esta decisión.
    impact:
      - FR-002
      - FR-003
      - FR-012
      - BR-012
      - AC-002
      - AC-010
      - AC-030
      - AP-005
      - AP-007
      - API-002
      - API-003
      - RISK-009
      - ADR-001
      - ADR-004
      - AV-001
      - FG-002
      - FG-005

