  - id: FG-002
    type: FUNCTIONAL_GAP
    priority: HIGH
    question: "¿Cuál es la capacidad máxima de un Event y qué ocurre si la creación la supera?"
    recommended: >
      Máximo de 5.000 Ticket por Event. Una creación que lo supere se rechaza
      completa con error de validación. La especificación solo exige capacidad
      mayor que cero; la creación síncrona y la consulta de disponibilidad
      tienen coste proporcional a la capacidad.
    decision: PENDING
    answer: null
