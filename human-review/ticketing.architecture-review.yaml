  - id: ADR-007
    type: ADR
    priority: HIGH
    title: "Idempotency"
    proposal: >
      Idempotency key obligatoria vinculada al cliente y registrada en la misma
      transacción que la Order; el estado de la Order como identidad del mensaje;
      PaymentAttempt único con lease y clave de idempotencia ante el proveedor;
      toda transición condicionada a Order en CREATED.
    alternatives:
      - Tabla de mensajes y solicitudes procesadas
      - Cola FIFO con deduplicación del servicio (descartada por la especificación)
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma la idempotencia por identidad explícita de cada operación,
      persistida junto con su efecto. La solicitud de compra exige la cabecera
      `Idempotency-Key`, vinculada al `customerId` derivado del JWT y registrada
      en la misma transacción que la Order, con un hash del contenido y una
      vigencia mínima de 24 horas. El consumidor usa el `orderId` y el estado de
      la Order como identidad del mensaje. Una Order admite un único
      PaymentAttempt activo, protegido por lease y enviado al proveedor como
      clave de idempotencia. Toda transición exige la Order en `CREATED`. Se
      descartan la tabla de mensajes procesados y la cola FIFO.

      Una repetición con la misma clave y el mismo contenido retorna la Order ya
      creada en su estado actual, sin repetir Reservation ni efectos. La misma
      clave con contenido distinto se rechaza sin efectos. La única acción
      adicional permitida en una repetición es republicar el mensaje de una
      Order en `CREATED` sin `enqueuedAt`, conforme a ADR-006. Se añaden dos
      cambios.

      Carrera con la misma clave. Cuando dos solicitudes simultáneas usan la
      misma `Idempotency-Key`, solo una transacción se confirma. La solicitud
      que pierde no debe responder indisponibilidad aunque su transacción se
      haya cancelado también por el estado de los Ticket: debe releer el
      registro de idempotencia con lectura fuertemente consistente y responder
      como repetición, con la misma Order, o con el rechazo por clave
      reutilizada si el contenido difiere. La existencia del registro de
      idempotencia tiene prioridad sobre cualquier otra causa de cancelación.

      Creación de Events. La creación de un Event también debe ser idempotente.
      La solicitud exige `Idempotency-Key`, vinculada a la identidad del
      `ADMIN` y registrada en la misma escritura transaccional que crea el Event
      en `PROVISIONING`, con hash del contenido. Una repetición retorna el mismo
      `eventId` con su estado de aprovisionamiento actual y no crea un segundo
      Event ni publica un segundo aprovisionamiento. Esto es necesario porque no
      existe operación para eliminar un Event y un duplicado quedaría listado y
      vendible.
    impact:
