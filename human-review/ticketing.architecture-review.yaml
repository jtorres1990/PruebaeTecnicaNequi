  - id: ADR-019
    type: ADR
    priority: MEDIUM
    title: "Test strategy"
    proposal: >
      Puerta de cobertura del 90 % medida con pruebas sin contenedores;
      concurrencia verificada por invariante con solicitudes simultáneas y reloj
      inyectado; prueba de carga con herramienta externa y verificación de
      invariantes de inventario al terminar.
    alternatives:
      - Cobertura alcanzada principalmente con pruebas de integración sobre emuladores
      - Concurrencia probada solo en la prueba de carga
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Se confirma la pirámide de pruebas con la puerta de cobertura del 90 %
      medida con pruebas que no requieren contenedores, la concurrencia
      verificada por invariante con solicitudes simultáneas, reloj inyectado y
      tiempo virtual, las pruebas de integración contra los emuladores, los
      flujos extremo a extremo con la colección de solicitudes y la prueba de
      carga con herramienta externa y verificación de invariantes al terminar.
      Se descartan la cobertura alcanzada principalmente con pruebas de
      integración y la concurrencia probada solo con la carga. Se añaden cinco
      cambios.

      Datos de carga. La prueba de carga incluye al menos un Event de 50.000
      Ticket y un escenario concentrado sobre ese Event con más de 1.000
      usuarios concurrentes conforme a ADR-001, usando más de 1.000 identidades
      `CUSTOMER` distintas conforme a ADR-014.

      Invariantes posteriores a la carga. Además de los originales, se verifica
      que cada bloqueo de Order activa corresponde a una Order en `CREATED` y
      que toda Order en `CREATED` tiene su bloqueo (ADR-013); que el índice de
      Orders pendientes de encolado queda vacío (ADR-006); que ninguna Order
      expiró por espera en cola (ADR-010); que no hay reversos de pago agotados
      (FG-003); y que la cantidad disponible informada coincide con los Ticket
      en `AVAILABLE` (ADR-021).

      Pruebas deterministas de los mecanismos aprobados. Se prueban la carrera
      de dos solicitudes con la misma `Idempotency-Key` que deben producir la
      misma Order (ADR-007); la reentrega del aprovisionamiento que no debe
      sobrescribir Ticket después de habilitar el Event (ADR-004); la
      cancelación anticipada que debe hacer rechazar el cobro posterior
      (FG-003); el barrido de republicación que no debe competir con la ruta
      síncrona (ADR-006); la imposibilidad de dos Orders activas del mismo
      cliente en el mismo Event (ADR-013); y las transiciones del circuit
      breaker con tiempo virtual (ADR-016).

      Escenarios de resiliencia extremo a extremo. Se documentan en el README y
      se demuestran sobre Docker Compose: detener el worker a mitad de un pago y
      verificar la reanudación por lease; detener el Payment Mock y verificar la
      apertura del circuito, la pausa del consumo y la recuperación; y detener
      la cola y verificar que la compra responde 503 sin modificar el
      inventario.

      Cobertura del Payment Mock. Conforme a ADR-015, `payment-mock` queda
      fuera de la métrica del 90 % y mantiene sus propias pruebas sin puerta de
      cobertura.

      Se mantiene como riesgo declarado que DynamoDB Local puede no sostener la
      carga objetivo; en ese caso la prueba se repite en un entorno de AWS y el
      resultado se informa junto con su entorno.
    impact:
      - NFR-013
      - TC-014
      - DEL-003
      - AC-007
