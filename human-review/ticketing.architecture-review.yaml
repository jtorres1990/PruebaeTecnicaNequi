  - id: ADR-008
    type: ADR
    priority: HIGH
    title: "Payment versus expiration race"
    proposal: >
      Gana la primera transición terminal confirmada, garantizado por la guarda
      de Order en CREATED. La confirmación exige además que `expiresAt` no haya
      pasado, y no se inicia un pago si faltan menos de 15 s. Un pago aprobado
      que no puede aplicarse se audita y alerta; su tratamiento depende de FG-003.
    alternatives:
      - Primera transición confirmada sin guarda temporal en la confirmación
      - El proceso de expiración respeta pagos en curso (descartada por superar los diez minutos)
    decision: CONFIRMED
    answer: >
      Se confirma que gana la primera transición terminal confirmada,
      garantizado por la guarda de Order en `CREATED`. `expiresAt` es la
      autoridad temporal única: la confirmación exige que `expiresAt` sea
      posterior al instante actual y la expiración exige que sea anterior o
      igual. El rechazo y el fallo no llevan guarda temporal.

      El consumidor no inicia un pago cuando falta menos del margen de corte
      para `expiresAt`, y la espera del resultado del pago se limita al tiempo
      restante de la Reservation. Se descartan la confirmación sin guarda
      temporal y la expiración que respeta pagos en curso.

      Una aprobación que no puede aplicarse no confirma la Order: los Ticket
      quedan liberados, la Order conserva su estado terminal y la anomalía se
      audita y se alerta. El tratamiento del pago se resuelve conforme a FG-003
      y los valores temporales conforme a AV-003.
    impact:
