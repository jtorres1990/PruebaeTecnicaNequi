decisions:

  - id: HV-001
    priority: HIGH
    question: "¿AVAILABLE, RESERVED, PENDING_CONFIRMATION, SOLD y COMPLIMENTARY pertenecen a Ticket, a Order o a ambos mediante máquinas de estado distintas?"
    reason: >
      El requerimiento atribuye los estados primero a las entradas y después,
      en el Requisito Funcional 4, a la orden de compra. La elección define las
      entidades, sus transiciones, la consulta de orden y el efecto contable.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Una orden de compra agrupa uno o más tickets. Todos los tickets
      pertenecientes a una misma orden deben procesarse como una unidad
      indivisible durante la compra.

      No se permiten ventas parciales de una orden: si un usuario solicita
      varios tickets, la operación debe completarse para todos los tickets
      solicitados o no completarse para ninguno.

      Los estados definidos en el requerimiento describen el estado de los
      tickets. El estado de la orden debe ser coherente con el estado conjunto
      de sus tickets, pero el modelo exacto de estados esta definido en HV-009, HV-011 y HV-018.

      Las transiciones que afecten una orden y sus tickets deben preservar esta
      consistencia de forma atómica.
    impact:
      - DS-001
      - DS-002
      - DS-003
      - DS-004
      - DS-005
      - ST-001
      - ST-002
      - ST-003
      - FR-008
      - FR-009
      - BR-001
      - AC-012
      - AC-013
      - Domain:Order
      - Domain:Ticket

  - id: HV-002
    priority: HIGH
    question: "¿La secuencia es solicitar → reservar → encolar, o solicitar → encolar → reservar de forma asíncrona en el consumidor?"
    reason: >
      La reserva "al iniciar una compra" y el encolado "inmediato" de la
      solicitud no fijan un orden entre ambas operaciones. Afecta la
      consistencia, la respuesta inmediata y el comportamiento ante fallos.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La simple selección de tickets o ubicaciones por parte del usuario
      no genera una reserva en el backend.

      Una reserva comienza únicamente cuando el usuario inicia formalmente
      el proceso de compra, por ejemplo al ejecutar la acción "Ir a pagar".

      En ese momento el sistema debe intentar reservar de forma atómica todos
      los tickets incluidos en la orden.

      Si todos los tickets continúan disponibles, se crea la reserva sobre
      todos ellos y comienza el período máximo de diez minutos.

      Si al menos uno de los tickets ya no está disponible, por ejemplo porque
      fue reservado previamente por otro usuario, la reserva completa debe
      rechazarse.

      No se permite reservar parcialmente una orden.

      Después de crear correctamente la reserva, la solicitud de compra puede
      continuar hacia el procesamiento asíncrono mediante la cola de mensajes.
    impact:
      - FR-004
      - FR-005
      - FR-006
      - ST-001
      - MF-002
      - AC-003
      - AC-004

  - id: HV-003
    priority: HIGH
    question: "¿Qué acción o condición convierte una reserva en una venta confirmada?"
    reason: >
      El requerimiento exige confirmar la compra dentro de diez minutos, pero
      no define el trigger de confirmación. Sin él no puede completarse la
      máquina de estados ni determinarse qué reservas expiran.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Una reserva se convierte en compra confirmada únicamente cuando el
      proceso de pago asociado finaliza exitosamente.

      El sistema debe simular un flujo de pago. Mientras el pago no haya sido
      aprobado, los tickets permanecen reservados y no deben considerarse
      vendidos.

      Si el resultado del pago es exitoso, la reserva se confirma y todos los
      tickets asociados cambian de estado a SOLD de forma conjunta.

      Si el pago falla, es rechazado o no se completa antes del vencimiento de
      la reserva, la compra no se confirma y los tickets deben liberarse,
      regresando al estado AVAILABLE.

      No se permite confirmación parcial: todos los tickets de la reserva se
      confirman juntos o ninguno se confirma.
    impact:
      - BR-003
      - ST-002
      - ST-003
      - FR-011
      - VAL-003
      - ALT-001
      - DS-004

  - id: HV-004
    priority: HIGH
    question: "¿Qué significa PENDING_CONFIRMATION, cómo se alcanza y cómo se abandona?"
    reason: >
      El estado solo se nombra y se aclara que no representa una venta. No hay
      semántica operacional ni transiciones de entrada o salida.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      PENDING_CONFIRMATION representa el estado en el que los tickets de una
      orden ya fueron reservados exitosamente y el proceso de pago se encuentra
      en curso o pendiente de una respuesta definitiva.

      Este estado se alcanza después de crear correctamente la reserva de todos
      los tickets solicitados y antes de conocer el resultado final del pago.

      Mientras los tickets se encuentren en PENDING_CONFIRMATION continúan
      bloqueados para otras órdenes y no se consideran vendidos.

      Si el proceso de pago responde exitosamente, todos los tickets asociados
      a la orden cambian conjuntamente a SOLD y la compra queda confirmada.

      Si el pago es rechazado, falla de forma definitiva o no se completa antes
      del vencimiento de la reserva, la compra no se confirma y todos los tickets
      de la reserva deben liberarse, regresando a AVAILABLE.

      No se permiten transiciones parciales: todos los tickets pertenecientes a
      una misma orden deben abandonar PENDING_CONFIRMATION de forma conjunta.
    impact:
      - DS-003
      - BR-005
      - BR-012
      - FR-009
      - ST-003

  - id: HV-005
    priority: HIGH
    question: "¿Cómo se crea una entrada COMPLIMENTARY, quién puede generarla y consume inventario o capacidad?"
    reason: >
      El estado solo se define como final y no contable. No existe flujo de
      creación, actor autorizado ni efecto declarado sobre el inventario.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Las entradas COMPLIMENTARY deben definirse únicamente durante la creación
      del evento.

      Al crear un evento, el actor responsable de su configuración podrá
      seleccionar qué ubicaciones serán destinadas como cortesías. Esas
      ubicaciones se crearán directamente en estado COMPLIMENTARY.

      Una entrada COMPLIMENTARY forma parte de la capacidad total del evento,
      pero no forma parte de la disponibilidad comercial para venta.

      Por lo tanto, las entradas de cortesía consumen capacidad física del
      evento y reducen desde el momento de su creación la cantidad de tickets
      disponibles para compra.

      Una vez creado el evento no se permitirá convertir una entrada AVAILABLE,
      RESERVED, PENDING_CONFIRMATION o SOLD en COMPLIMENTARY, ni agregar nuevas
      cortesías posteriormente.

      El estado COMPLIMENTARY es final y no contable, de acuerdo con el
      requerimiento original.

      El perfil ADMIN define las cortesías durante la creación del evento.
    impact:
      - DS-005
      - BR-007
      - BR-012
      - AC-013
      - FR-003
      - FR-012

  - id: HV-006
    priority: HIGH
    question: "¿El dominio administra entradas o asientos individuales, o únicamente una cantidad disponible por evento?"
    reason: >
      El texto habla de asientos vendidos a múltiples personas y de "cada
      entrada", pero el evento solo exige capacidad total e inventario. La
      respuesta cambia el modelo de dominio, las reservas y el control de
      concurrencia.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      El sistema administrará tickets o ubicaciones individuales dentro de
      cada evento, no únicamente una cantidad agregada de entradas disponibles.

      Cada evento tendrá una capacidad total y un conjunto de ubicaciones
      numeradas e identificables de forma única dentro del evento.

      Cada ubicación representa una entrada individual y solo puede estar
      asociada a una compra o reserva activa a la vez.

      Cuando múltiples usuarios intenten reservar o comprar concurrentemente
      la misma ubicación, el sistema debe garantizar que solamente una de las
      solicitudes pueda adquirirla.

      La disponibilidad agregada del evento podrá calcularse a partir del
      estado de sus tickets individuales.
    impact:
      - Domain:Ticket
      - Domain:Inventory
      - FR-003
      - FR-004
      - FR-012
      - BR-001
      - BR-012

  - id: HV-007
    priority: MEDIUM
    question: "¿\"Disponibilidad en tiempo real\" significa una lectura actual bajo demanda o actualizaciones continuas hacia el cliente?"
    reason: >
      La semántica de "tiempo real" no está definida y el analista no debe
      asumir una tecnología ni un modo de entrega.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La disponibilidad en tiempo real se interpretará como una consulta bajo
      demanda del estado actual de los tickets de un evento.

      Cuando un usuario ingrese al flujo de compra o consulte un evento, el
      sistema deberá obtener y retornar la disponibilidad vigente de sus
      ubicaciones en ese momento.

      No se requiere mantener un canal de actualización continua hacia el
      cliente mediante streaming, SSE o WebSocket.

      La disponibilidad mostrada al usuario es informativa y no constituye una
      garantía de adquisición del ticket, ya que otros usuarios pueden intentar
      reservar la misma ubicación de forma concurrente.

      La disponibilidad efectiva y autoritativa deberá validarse nuevamente
      cuando el usuario inicie formalmente la compra mediante la acción de
      reservar o "Ir a pagar".

      Si alguno de los tickets seleccionados ya no se encuentra disponible en
      ese momento, la reserva completa deberá ser rechazada de acuerdo con la
      regla de atomicidad de la orden.

      Las alternativas de actualización continua, fan-out de eventos y
      estrategias de escalabilidad para escenarios de muy alta concurrencia
      podrán documentarse posteriormente como decisiones o evoluciones de
      arquitectura, pero quedan fuera del alcance funcional de esta versión.
    impact:
      - FR-012
      - CAP-002
      - AC-010

  - id: HV-008
    priority: HIGH
    question: "¿Existe un flujo o proveedor de pago, y la confirmación de la compra depende de un resultado de pago?"
    reason: >
      Se habla de compra confirmada, pero el requerimiento no menciona pago.
      La respuesta define el trigger de SOLD y los fallos de confirmación.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      El sistema incluirá un servicio de pago simulado independiente del backend
      principal de ticketing.

      Este mock representará un proveedor externo de pagos y permitirá simular,
      como mínimo, respuestas de pago exitosas y fallidas para poder validar los
      diferentes escenarios funcionales y de integración.

      El backend de ticketing enviará la solicitud de pago al proveedor simulado
      únicamente después de que todos los tickets de la orden hayan sido
      reservados correctamente.

      Mientras se espera el resultado del pago, los tickets permanecerán
      bloqueados y la compra se encontrará en proceso de confirmación.

      Si el proveedor simulado responde exitosamente, la compra se confirma y
      todos los tickets de la orden cambian conjuntamente a SOLD.

      Si el proveedor responde con un rechazo o fallo definitivo, la compra no
      se confirma y todos los tickets asociados a la reserva deben liberarse,
      regresando a AVAILABLE.

      El proveedor de pago simulado se utilizará para probar de forma
      determinista tanto los flujos exitosos como los escenarios de fallo.

      La tecnología, protocolo de comunicación y diseño interno del mock serán
      definidos posteriormente durante la etapa de arquitectura.
    impact:
      - Domain:Payment
      - DS-004
      - BR-003
      - ST-003

  - id: HV-009
    priority: HIGH
    question: "¿Qué estado y resultado consultable debe tener una orden rechazada por disponibilidad insuficiente o por fallo en el procesamiento asíncrono?"
    reason: >
      La lista de estados no incluye rechazo, fallo ni cancelación, y el
      consumidor puede no encontrar disponibilidad al validar. Sin esta
      definición no pueden cerrarse los flujos alternativos ni los errores.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La orden de compra tendrá estados propios, independientes de los estados
      de los tickets, para representar correctamente el resultado del
      procesamiento.

      Cuando una orden no pueda completarse por una condición funcional o de
      negocio, por ejemplo porque alguno de los tickets solicitados ya no se
      encuentra disponible, la orden debe finalizar en estado REJECTED.

      Cuando ocurra un error técnico definitivo durante el procesamiento
      asíncrono y la operación no pueda completarse correctamente, la orden debe
      finalizar en estado FAILED.

      Cuando la reserva supere el tiempo máximo de diez minutos sin que la compra
      haya sido confirmada, la orden debe finalizar en estado EXPIRED.

      Cuando la compra finalice satisfactoriamente,la orden debe finalizar en estado CONFIRMED. 

      En los estados REJECTED, FAILED o EXPIRED ningún ticket de la orden puede
      permanecer vendido. Los tickets que hubieran sido reservados deben
      liberarse de forma conjunta y regresar a AVAILABLE, salvo que exista una
      condición de procesamiento aún recuperable que deba resolverse antes de
      liberar la reserva.

      La consulta de una orden debe permitir identificar su estado actual y,
      cuando no haya finalizado exitosamente, exponer una causa funcional
      comprensible del rechazo, fallo o expiración sin revelar detalles técnicos
      internos.

      No se permiten resultados parciales: una orden nunca puede finalizar con
      solo una parte de sus tickets vendidos. 
  
    impact:
      - FR-008
      - FR-009
      - ALT-002
      - ERR-002
      - AC-005

  - id: HV-010
    priority: HIGH
    question: "¿SQS es obligatorio, o puede usarse cualquier cola que cumpla la función?"
    reason: >
      El stack permite "LocalStack u cualquier otra solución que cumpla esta
      función", pero las Especificaciones Técnicas ordenan configurar SQS.
      Es una contradicción sobre una restricción tecnológica.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Amazon SQS será la tecnología de mensajería utilizada para el procesamiento
      asíncrono de órdenes.

      Para el entorno local de desarrollo y pruebas se utilizará LocalStack para
      emular Amazon SQS, manteniendo el mismo modelo de integración que se usaría
      posteriormente en AWS.

      Se utilizará una cola SQS Standard, ya que el requerimiento exige una
      semántica de procesamiento at-least-once y esta opción permite demostrar
      explícitamente el manejo seguro de mensajes duplicados mediante
      idempotencia en la aplicación.

      La solución no dependerá de garantías de orden estricto ni de deduplicación
      provistas por una cola FIFO. La aplicación será responsable de garantizar
      que la recepción repetida de un mismo mensaje no produzca pagos, ventas,
      reservas ni modificaciones de inventario duplicadas.

      La estrategia concreta de consumo, visibility timeout, retries, Dead Letter
      Queue y demás parámetros operativos de SQS será definida posteriormente en
      la etapa de arquitectura.

      Para esta prueba se prioriza LocalStack durante el desarrollo, por lo que
      no es necesario incurrir en costos de AWS para ejecutar el sistema
      localmente.
    impact:
      - TC-005
      - TC-010
      - DEL-005

  - id: HV-011
    priority: HIGH
    question: "¿Cuál es la regla funcional ante la entrega o el envío repetido de una misma solicitud u orden?"
    reason: >
      El procesamiento at-least-once admite duplicados y las compras
      duplicadas son un problema declarado en el contexto, pero no se define
      la regla de negocio frente a la repetición.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      El procesamiento de órdenes y pagos debe ser idempotente. La recepción
      repetida de una misma solicitud, mensaje u operación no puede producir
      efectos de negocio adicionales después de la primera ejecución válida.

      Cada orden tendrá un identificador único y las operaciones que puedan ser
      repetidas deberán poder identificarse de forma inequívoca.

      Si una orden ya fue confirmada y sus tickets se encuentran vendidos, un
      nuevo procesamiento de la misma operación no debe generar otro pago,
      otra venta ni nuevas modificaciones de inventario. El sistema debe
      retornar o conservar el resultado previamente obtenido.

      Si la orden se encuentra en PENDING_CONFIRMATION y ya existe un intento
      de pago activo, una recepción duplicada de la misma operación no debe
      iniciar un segundo pago. El sistema debe conservar el intento existente
      y retornar el estado actual del procesamiento.

      Una orden no puede tener más de un intento de pago activo simultáneamente.

      Los mensajes duplicados recibidos como consecuencia de la entrega
      at-least-once deben poder reprocesarse de forma segura sin duplicar pagos,
      reservas, ventas ni transiciones de estado.

      Los estados terminales CONFIRMED, REJECTED, FAILED y EXPIRED no deben
      ejecutar nuevamente efectos de negocio al recibir duplicados de una
      operación ya procesada.

      Un nuevo intento de pago autorizado después de un fallo recuperable se
      considera una operación diferente y deberá contar con una identidad
      propia, manteniendo siempre la misma orden de compra.

      La estrategia técnica utilizada para implementar la idempotencia,
      incluyendo idempotency keys, conditional writes, almacenamiento de
      operaciones procesadas o mecanismos equivalentes, será definida durante
      la etapa de arquitectura.
    impact:
      - ALT-003
      - ERR-004
      - FR-007
      - TC-010
      - EVAL-008

  - id: HV-012
    priority: HIGH
    question: "¿Cuándo empieza exactamente el plazo de diez minutos, y la reserva se identifica por orden, cliente, entradas o evento y cantidad?"
    reason: "El máximo de diez minutos está definido, pero no su origen temporal ni el alcance de la reserva. Afecta expiración, liberación y concurrencia"
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      El plazo máximo de diez minutos comienza en el momento en que el backend
      crea exitosamente la reserva de todos los tickets solicitados por la orden.

      La selección de asientos realizada por el usuario antes de iniciar
      formalmente la compra no crea una reserva ni inicia el temporizador.

      La reserva está asociada a una única orden de compra y contiene exactamente
      los tickets individuales solicitados por dicha orden.

      La reserva debe ser atómica: si alguno de los tickets solicitados no está
      disponible al momento de intentar crearla, no se crea ninguna reserva para
      esa orden.

      Una vez creada la reserva, todos sus tickets quedan en estado RESERVED y
      permanecen bloqueados para otras órdenes durante un máximo de diez minutos.

      Si la compra no se confirma antes del vencimiento del plazo, la reserva
      expira y todos los tickets asociados deben liberarse conjuntamente,
      regresando al estado AVAILABLE.

      No se permiten expiraciones ni liberaciones parciales de una reserva.
    impact:
      - FR-004
      - FR-011
      - BR-002
      - ST-002
      - VAL-001
      - VAL-003
      - Domain:Reservation

  - id: HV-013
    priority: MEDIUM
    question: "¿Los reportes operativos, contables y de inventario están dentro del alcance funcional, o solo debe preservarse la semántica de los estados?"
    reason: >
      El requerimiento menciona el impacto de los estados en los reportes,
      pero no pide consultar ni generar reportes. El alcance no debe ampliarse
      ni reducirse sin autorización.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La generación, consulta o exportación de reportes operativos, contables
      y de inventario no forma parte del alcance funcional de esta prueba.

      El sistema sí debe preservar correctamente la semántica de los estados
      de los tickets, ya que estos estados determinan su impacto futuro en
      dichos reportes.

      RESERVED y PENDING_CONFIRMATION no representan ventas.

      SOLD representa una venta confirmada.

      COMPLIMENTARY es un estado final que consume capacidad del evento, pero
      no debe contabilizarse como venta.

      No se implementarán endpoints, procesos ni funcionalidades específicas
      de reporting en esta versión.
    impact:
      - Domain:Report
      - DS-004
      - DS-005

  - id: HV-014
    priority: MEDIUM
    question: "¿Qué actores, roles y reglas de autenticación y autorización aplican a crear eventos, comprar, consultar órdenes y emitir cortesías?"
    reason: >
      La seguridad es criterio de evaluación, pero el requerimiento no define
      quién crea eventos, quién compra ni qué permisos aplican.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      El sistema requerirá autenticación mediante JWT y utilizará Amazon Cognito
      como proveedor de identidad responsable de autenticar a los usuarios y
      emitir los tokens de acceso.

      Se definirán inicialmente dos roles funcionales: ADMIN y CUSTOMER.

      Los roles serán representados mediante grupos de Amazon Cognito e incluidos
      en el JWT mediante el claim cognito:groups. El backend transformará estos
      grupos en autoridades de aplicación para aplicar las reglas de
      autorización.

      El rol ADMIN podrá crear eventos y definir las ubicaciones
      COMPLIMENTARY únicamente durante la creación del evento.

      El rol CUSTOMER podrá consultar eventos y disponibilidad, iniciar compras
      y consultar el estado de sus propias órdenes.

      Un CUSTOMER no podrá consultar órdenes pertenecientes a otros usuarios.
      La identidad del propietario de una orden deberá derivarse de la identidad
      autenticada presente en el JWT y no de un identificador de usuario enviado
      libremente por el cliente.

      El backend actuará como OAuth2 Resource Server y será responsable de
      validar los JWT emitidos por Cognito antes de permitir el acceso a
      operaciones protegidas.

      La implementación de interfaces de login, registro, recuperación de
      contraseña o administración visual de usuarios queda fuera del alcance
      de esta prueba.

      Los detalles de configuración de Cognito, OAuth2/OIDC, mapeo de grupos,
      expiración de tokens y despliegue serán definidos en la etapa de
      arquitectura.
    impact:
      - Actors:Usuario/cliente
      - FR-001
      - FR-004
      - FR-009
      - FR-012
      - NFR-010
      - EVAL-006

  - id: HV-015
    priority: MEDIUM
    question: "¿Cuáles son los umbrales verificables de concurrencia, throughput y latencia bajo carga?"
    reason: >
      "Miles de solicitudes", "eficiente" y "tiempos de respuesta bajos" no
      permiten una verificación objetiva y el analista no puede inventar
      cifras.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Para esta implementación se establecerán objetivos de rendimiento
      verificables que permitan evaluar el comportamiento del sistema bajo
      concurrencia, sin pretender representar el dimensionamiento definitivo
      de un entorno productivo.

      La prueba de carga tendrá como objetivo soportar al menos 1.000 usuarios
      concurrentes y una carga sostenida aproximada de 200 solicitudes por
      segundo.

      Para las consultas de disponibilidad se establece como objetivo un tiempo
      de respuesta p95 inferior a 500 milisegundos.

      Para las operaciones síncronas asociadas al inicio de una compra y al
      intento de reserva de tickets se establece como objetivo un tiempo de
      respuesta p95 inferior a 1 segundo.

      El procesamiento posterior de pago y confirmación de la compra es
      asíncrono y, por tanto, no forma parte del tiempo de respuesta síncrono
      esperado para iniciar una orden.

      Independientemente del volumen de carga, los criterios funcionales
      prioritarios son mantener cero sobreventas y cero ventas duplicadas.

      Estos valores representan objetivos de prueba para esta solución y podrán
      revisarse en un entorno productivo después de realizar pruebas de carga,
      análisis de capacidad y dimensionamiento de infraestructura.
    impact:
      - NFR-001
      - NFR-002
      - AC-007
      - EVAL-005

  - id: HV-016
    priority: MEDIUM
    question: "¿Qué validaciones aplican a la fecha y la capacidad del evento (zona horaria, fechas pasadas, cero, valores negativos)?"
    reason: >
      El requerimiento solo enumera los campos básicos del evento, sin reglas
      de validación.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La creación de un evento debe validar como mínimo nombre, lugar,
      fecha y hora del evento, y capacidad total.

      El nombre y el lugar son obligatorios y no pueden estar vacíos.

      La fecha y hora del evento son obligatorias y deben representar un
      instante futuro respecto al momento de creación del evento.

      La referencia temporal del sistema será UTC. No se dejará fija una zona
      horaria regional como America/Bogota dentro de las reglas funcionales.

      La capacidad total del evento debe ser un número entero mayor que cero.

      Como el sistema manejará tickets o ubicaciones individuales, la capacidad
      total del evento debe coincidir con la cantidad total de ubicaciones
      creadas para ese evento.

      Las ubicaciones COMPLIMENTARY forman parte de la capacidad total del evento,
      aunque no formen parte de la disponibilidad comercial.

      Por ejemplo, un evento con capacidad 500 puede tener 480 tickets AVAILABLE
      y 20 tickets COMPLIMENTARY, manteniendo una capacidad total de 500.

      No debe permitirse crear un evento con capacidad cero, negativa o
      inconsistente con la cantidad de ubicaciones definidas.

      El formato concreto de almacenamiento, serialización y conversión de fechas
      será definido posteriormente durante la etapa de arquitectura.
    impact:
      - FR-001
      - AC-001
      - Domain:Event

  - id: HV-017
    priority: HIGH
    question: "¿Cuál es la cardinalidad entre una orden, una reserva y las entradas o cantidades solicitadas, y puede una orden abarcar más de un evento?"
    reason: >
      La relación entre orden, reserva y entradas no está definida. Afecta el
      modelo de dominio, la atomicidad y la consulta de orden.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Cada orden de compra pertenece a un único evento y solicita uno o más
      tickets individuales de ese evento.

      Una orden no puede incluir tickets pertenecientes a eventos diferentes.

      La orden se procesa de forma atómica: todos los tickets solicitados deben
      poder reservarse y posteriormente adquirirse, o la operación completa
      debe fallar. No se permiten ventas parciales.

      Una orden puede tener como máximo una reserva activa. La reserva, cuando
      existe, agrupa exactamente los tickets solicitados por la orden.

      Cada ticket pertenece a un único evento y puede formar parte como máximo
      de una reserva activa al mismo tiempo.

      La cardinalidad inicial queda definida como:

      Event 1 -> N Ticket
      Event 1 -> N Order
      Order 1 -> N Ticket requested
      Order 1 -> 0..1 Reservation
      Reservation 1 -> N Ticket
    impact:
      - Domain:Order
      - Domain:Reservation
      - Domain:Ticket
      - FR-004
      - FR-009

  - id: HV-018
    priority: HIGH
    question: "¿Cuál es el estado inicial de la orden cuyo identificador se retorna, y qué debe ocurrir si el encolado falla?"
    reason: >
      Se exige retornar un identificador de orden inmediatamente, sin definir
      su estado inicial ni el resultado de una aceptación fallida.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      La orden se crea únicamente después de que todos los tickets solicitados
      hayan podido reservarse correctamente de forma atómica.

      La orden tendrá como estado inicial CREATED.

      Después de crear la orden y su reserva, el sistema debe intentar encolar
      la solicitud para continuar con el procesamiento asíncrono.

      Si el encolado se realiza correctamente, la orden puede continuar al
      siguiente estado de procesamiento definido para el flujo asíncrono.

      Si el encolado falla de forma definitiva y la solicitud no puede ser
      aceptada para procesamiento, la orden debe finalizar en estado FAILED.

      En ese caso, la reserva asociada debe cancelarse y todos los tickets
      reservados deben liberarse conjuntamente, regresando a AVAILABLE.

      El sistema no debe mantener tickets reservados si la orden no pudo ser
      enviada al flujo asíncrono.

      El identificador de orden solo debe retornarse al cliente cuando el sistema
      haya creado de forma consistente la orden y haya determinado que la
      solicitud puede continuar o que existe un estado persistido consultable
      para informar su resultado.

      No se permite dejar una orden en un estado intermedio indefinido por un
      fallo de encolado.
    impact:
      - FR-005
      - FR-006
      - FR-009
      - MF-002
      - AC-003

  - id: HV-019
    priority: MEDIUM
    question: "¿DynamoDB Local es obligatorio, o puede usarse cualquier otra persistencia NoSQL?"
    reason: >
      El stack permite "DynamoDB Local u otra solución de persistencia", el
      Objetivo exige persistencia NoSQL y el Entregable 5 enumera DynamoDB
      Local entre las dependencias del docker-compose.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Amazon DynamoDB será la base de datos NoSQL utilizada como persistencia
      objetivo del sistema.

      Para desarrollo y pruebas locales se utilizará DynamoDB Local, permitiendo
      ejecutar la solución sin depender de infraestructura AWS real.

      DynamoDB almacenará la información necesaria de eventos, tickets,
      órdenes, reservas y demás datos persistentes definidos posteriormente
      durante el diseño de arquitectura.

      La elección de DynamoDB busca mantener coherencia con el enfoque
      cloud-native basado en AWS y facilitar la implementación de controles de
      concurrencia mediante capacidades como conditional writes y operaciones
      transaccionales.

      El modelo concreto de particiones, sort keys, índices, access patterns,
      transacciones y estrategia de consistencia será definido posteriormente
      por el Architect Agent y no forma parte de esta decisión funcional.

      La implementación local deberá ser compatible conceptualmente con la
      utilización posterior de Amazon DynamoDB en un entorno AWS.
    impact:
      - TC-004
      - NFR-006
      - DEL-005

  - id: HV-020
    priority: LOW
    question: "¿Qué significa \"evento disponible\" al consultar eventos?"
    reason: >
      El Objetivo habla de consultar eventos disponibles sin definir el
      criterio de disponibilidad de un evento.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Un evento disponible es un evento cuya fecha y hora aún no han ocurrido y
      que se encuentra habilitado para consulta y venta.

      Un evento futuro puede seguir apareciendo en la consulta de eventos aunque
      no tenga tickets disponibles para compra en ese momento.

      Por lo tanto, un evento agotado no deja de considerarse disponible para
      consulta únicamente porque su disponibilidad comercial sea cero.

      La disponibilidad de tickets debe consultarse y mostrarse por separado,
      permitiendo distinguir entre un evento futuro con tickets disponibles y
      un evento futuro agotado.

      Los eventos cuya fecha y hora ya hayan ocurrido no deben incluirse dentro
      de la consulta normal de eventos disponibles.

      La definición de un estado adicional de publicación o habilitación del
      evento, en caso de considerarse necesario, será evaluada posteriormente
      durante la etapa de arquitectura y no se introduce como requisito
      funcional adicional en esta decisión.
    impact:
      - FR-002
      - AC-002
      - MF-001

  - id: HV-021
    priority: LOW
    question: "¿Qué resultado debe obtenerse al consultar una orden inexistente?"
    reason: >
      El Requisito Funcional 4 solo describe la consulta de una orden
      existente; el resultado para un identificador desconocido no está
      definido.
    decision: CONFIRMED_WITH_CHANGE
    answer: >
      Cuando se consulte una orden inexistente, el sistema deberá responder que
      el recurso no fue encontrado.

      Una orden existente en estado REJECTED, FAILED o EXPIRED continúa siendo
      una orden válida y consultable, por lo que deberá retornarse normalmente
      junto con su estado y la información funcional disponible sobre el
      resultado del procesamiento.

      Si un usuario con rol CUSTOMER intenta consultar una orden que pertenece
      a otro usuario, el sistema deberá responder igualmente como recurso no
      encontrado, evitando revelar la existencia de órdenes pertenecientes a
      otros clientes.

      De esta forma, para un CUSTOMER no debe ser posible distinguir mediante
      la API entre un identificador de orden inexistente y un identificador de
      una orden que no le pertenece.

      La representación HTTP concreta y el modelo de error serán definidos
      posteriormente durante la etapa de arquitectura.
    impact:
      - ERR-006
      - FR-009
      - AC-006

